# Levantar todo:  docker compose up -d --build
# La web queda en http://<ip-del-servidor>:${WEB_PORT:-8080}

services:
  api:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    image: lista-compras-api
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - lista-compras-data:/data

  web:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/}
    image: lista-compras-web
    restart: unless-stopped
    environment:
      # "off" o un texto (por ejemplo "Lista de compras") para pedir usuario y contraseña
      # según auth/htpasswd. Ver DEPLOY.md.
      AUTH_BASIC: ${AUTH_BASIC:-off}
    volumes:
      - ./auth:/etc/nginx/auth:ro
    ports:
      # Detrás de un nginx en el mismo server, usar WEB_BIND=127.0.0.1 para no exponerlo.
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  lista-compras-data:
