# Plantilla: al iniciar el contenedor, nginx reemplaza ${BASE_PATH}, ${API_UPSTREAM} y
# ${AUTH_BASIC} con las variables de entorno (ver Dockerfile y docker-compose.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirecciones relativas: funcionan detrás de cualquier proxy o puerto.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Usuario y contraseña opcionales ("off" para desactivar).
    auth_basic "${AUTH_BASIC}";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    # Para el healthcheck de Docker, sin autenticación.
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }

    location ${BASE_PATH}api/ {
        proxy_pass ${API_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location ${BASE_PATH}assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ${BASE_PATH} {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ ${BASE_PATH}index.html;
    }
}
